source_quirks:
- 變數名稱大小寫不一致：公式與變數說明用大寫「S」，比容積公式表內用小寫「s」，照原文保留。
- PDF 文字層含圖面上被白色遮蔽、看不見的鄰條文字（頁頂為第八十三條之一第二項第二款末句及第三款，頁底為第八十四條開頭），以文字層取字時會混入，非本表內容。
uncertain:
- （第二輪）公式單行化是否補「×」：原式 V/S 與 ln(…) 並列相乘、沒有印乘號；規則 4 要求符號與原文一致，但規格範例寫成「W = V / S × ln(100 / (100 − C))」，我依範例補了「×」。數學意義不變，請校對者決定是否保留。
- （第一輪）公式為圖片，無文字層可交叉核對；僅以 300dpi 圖面判讀，判讀為 W = (V/S) ln(100/(100 − C))，結構與符號清楚，但請設備師對照 PDF 原圖確認（特別是 ln 前有無省略的乘號、減號為「−」）。
cross_check: 2026-10-01 兩輪獨立轉錄（第一輪 Sonnet、第二輪 Opus）逐格比對：非空格 4 格；內容或寫法不同 0 處。公式兩輪讀法相同，差在是否補乘號；已看原圖，原文無乘號。裁決：公式：原圖 V/S 與 ln(…) 直接並列、未印乘號；採不補乘號的寫法。
