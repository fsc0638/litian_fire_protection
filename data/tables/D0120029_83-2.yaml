parts:
- title: 第一款 所需滅火藥劑量計算公式
  kind: formula
  formula: W = (V / S) ln(100 / (100 − C))
  variables:
    W: 防護空間所需藥劑量（kg）
    V: 防護空間淨體積（m³，得扣除不滲透且不可移動固體體積）
    S: 防護空間之最低溫度（t℃）、一大氣壓下之比容積（m³/kg）
    C: 設計濃度百分比（%，體積百分比）
  notes:
  - 轉錄說明：本公式在 PDF 中是內嵌點陣圖（JPEG，287×108 像素），沒有文字層，只能目視判讀。
  - 轉錄說明：原式為分數 V/S 與 ln(…) 直接並列（未印乘號），括號內為分數 100 / (100 − C)；W、V、S、ln 為斜體。單行化時依規格範例補「×」，並以括號標出分母。
  - 轉錄說明：變數說明中的「m³」在文字層為「m」加單一字元 U+00B3（上標3），照原字保留，未改寫為 m^3。
- title: 第一款 變數 S 之比容積公式（依滅火藥劑種類）
  kind: table
