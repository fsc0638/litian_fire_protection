  - 'no': 13
    place: 13.無線電通信輔助設備
    cells:
      耐燃保護:
        raw: 緊急電源—增幅器
      同軸電纜:
        raw: 增幅器—分配器等、增幅器—洩波同軸電纜、分配器等—無線電接頭、分配器等—天線、分配器等—洩波同軸電纜
  notes:
  - 註一：火警發信機兼作其他消防安全設備之啟動裝置者：標示燈回路應採耐熱保護。
  - 註二：中繼器（亦稱模組）之緊急電源回路：中繼器內置蓄電池者，得採一般配線。
  - 註三：中繼器之控制回路：得採耐熱保護。
  - 註四：標示設備內置蓄電池者：得採一般配線。
  - 註五：天花板及底板使用不燃材料者：得採耐熱保護；緊急照明燈內置蓄電池者：得採一般配線。
  - 註六：開啟後需外加緊急電源保持開啟狀態者：緊急電源回路應採耐燃保護。
  - 說明：一、經受信總機或控制盤供應緊急電源之裝置：應採耐燃保護；其控制回路：得採耐熱保護。
  - 二、防災監控系統綜合操作裝置與消防安全設備間之配線應採耐熱保護，其與緊急電源間之配線應採耐燃保護。但受信總機、擴音機、操作裝置等設於防災中心時，在防災中心其間之配線得採一般配線。
  - 三、〔圖例：粗黑實線〕：耐燃保護；〔圖例：斜線填充雙線〕：耐熱保護；〔圖例：空心雙線〕：同軸電纜 ; 〔圖例：細實線〕：一般配線；〔圖例：點虛線〕：配管。
  - 【轉錄說明】以上註一至註六、說明一至三為原表下方兩格，逐字照文字層並接合換行；說明三中的線型符號原文為圖形，以〔圖例：…〕描述代入，見 source_quirks。
  - 【轉錄說明】原表兩欄表頭為「設備種類」（對應 place）與「耐燃或耐熱保護範圍」（配線圖所在欄）；columns 依規格改為圖例五種線型。
  - 【轉錄說明】「（註X）」為轉錄者附記：圖上「註X」字樣緊貼在該段配線旁。第 4、5 列「受信總機—中繼器」各有兩條線：粗實線旁印「註二」、斜線填充線旁印「註三」。
  - 【轉錄說明】方框相接未畫連線者不列為配線段：第 1 列「啟動裝置」框疊在「消防栓箱」框上方相接；第 3 列「電磁閥」框疊在「啟動用氣體容器」框上方相接；第 2 列「壓力檢知裝置」框疊在「流水檢知裝置」框上方相接。
  - 【轉錄說明】第 6 列（一一九火災通報裝置）圖中沒有「緊急電源」方框，只有受信總機、一一九火災通報裝置、遠端啟動裝置三框。
  - 【轉錄說明】方框名稱中較小字級的「或」字（如「控制盤或受信總機」「出水口或採水口」「手動開關裝置或遠隔操作開關裝置」）照字面併入名稱。
notes: []
source_quirks:
- 說明三：「同軸電纜」後的分隔符為半形分號且前後各有一個半形空格（「同軸電纜 ; 」），其餘各項用全形「；」；照原文保留。
- 說明三的五種線型圖例為圖形符號，文字層只有「：耐燃保護；」等文字；notes 中以〔圖例：…〕描述代入，非原文文字。
- 圖中方框文字只有第 2、4 列在 PDF 文字層中，其餘第 1、3、5–13 列的方框文字為個別嵌入的點陣小圖；第 6 列整張配線圖為一張 782×153 px 點陣圖。
uncertain:
- （第二輪）第 2 列（自動撒水設備等）配管：幫浦引出的點虛線正好止於「壓力檢知裝置」與「流水檢知裝置」兩框相接的共用邊線（向量座標 y≈570.9pt），無法判定只接其一；暫記為「幫浦—壓力檢知裝置、幫浦—流水檢知裝置」兩段。
- （第二輪）第 1、2、10 列「電動機┊幫浦」與第 11 列「電動機┊排煙機」：兩名稱在同一方框內以點虛線分隔；判讀為框內分隔線而非配管，未列入「配管」欄，請校對是否應視為配管。
- （第二輪）第 5 列方框內分兩行印「擴 音 機」「操作裝置」，已接寫為「擴音機操作裝置」；無法判定原意為單一裝置，或「擴音機」與「操作裝置」合畫一框。
- （第二輪）第 7 列方框文字「操作裝置(含遠隔操作裝置)或啟動裝置」為點陣圖片、無文字層；括號目視判為半形「( )」，全半形無法以文字層確認。
- （第二輪）第 6 列整張配線圖為低解析點陣圖，兩段線依目視判為斜線填充（耐熱保護），未能以向量資料交叉核對。
- （第二輪）第 1、3、5–13 列方框文字（如「幫浦」「電磁閥」「洩波同軸電纜」「遠端啟動裝置」）為點陣圖片，無文字層可逐字核對，係 400dpi 目視判讀。
- （第一輪）「鹵化烴」字形：PDF 文字層為「烴」(U+70F4)，但頁面渲染字形看起來是「煙」(U+7159)，拿不準原稿究竟是哪個字（法規慣用詞為「鹵化烴」）；本檔採文字層「烴」，請校對者對照官方公報確認（出現於設備種類第 3 項的列名）
- （第一輪）第 2 項（自動撒水設備…）配管：虛線從「幫浦」接到「壓力檢知裝置」與「流水檢知裝置」兩個上下相鄰方框的交界線，無法判斷是接哪一個或兩個都接；本檔記為「幫浦—壓力檢知裝置／流水檢知裝置交界」。
- （第一輪）第 2 項耐熱保護：圖下方的斜線長線從「控制盤或受信總機」下緣繞到方框群右下，接在「流水檢知裝置」（下方那個方框）的下緣；是否同時涵蓋「壓力檢知裝置」無法由圖判斷；本檔記為「控制盤或受信總機—流水檢知裝置」。
- （第一輪）第 4 項：「受信總機」與「中繼器」之間有兩條線——粗黑線（旁標註二）與斜線繞行長線（旁標註三）；本檔分別記為「受信總機—中繼器（註二）」於耐燃保護、「受信總機—中繼器（註三）」於耐熱保護。
- （第一輪）第 4 項：兩個「註一」標示位置分別貼近「標示燈」與「火警發信機」；本檔判讀為這兩條細線（受信總機—標示燈、受信總機—火警發信機）各帶註一，細線的線型判為一般配線。
- （第一輪）第 4 項：圖中有兩個「探測器」方框與兩個「定址式探測器」方框，以另一端設備區分（受信總機—探測器／中繼器—探測器；受信總機—定址式探測器／中繼器—定址式探測器）。
- （第一輪）第 5 項：圖中有兩個「檢知器」方框；「檢知器—檢知區域警報裝置」「檢知器—瓦斯漏氣表示燈」兩條細線接的是上方（受信總機直接連到的）那一個；「受信總機—檢知器」「中繼器—檢知器」分別指上方、下方者。
- （第一輪）第 5 項：方框內為兩行「擴 音 機」「操作裝置」（「擴音機」字間有空白），本檔合記為「擴音機操作裝置」；也可能是「擴音機」與「操作裝置」兩個設備併成一框，無法由圖判斷。
- （第一輪）第 13 項：圖中有兩個「洩波同軸電纜」方框（左下接增幅器、正下接分配器等），以另一端設備區分；增幅器—洩波同軸電纜為雙線空心轉折線，判為同軸電纜。
- （第一輪）第 3 項：「控制盤—自動關閉裝置」為階梯狀斜線窄帶，判為耐熱保護；「控制盤—探測器」為階梯狀單細線，判為一般配線。
cross_check: 2026-10-01 兩輪獨立轉錄（第一輪 Sonnet、第二輪 Opus）逐格比對：非空格 31 格；內容或寫法不同 7 處。配線段以「不分順序、不分方向」比對：只有系統 2 的配管一處不同（虛線止於「壓力檢知裝置」與「流水檢知裝置」兩框交界），已看原圖無法判定，暫記兩者都接並列入不確定處。其餘線段兩輪一致。
