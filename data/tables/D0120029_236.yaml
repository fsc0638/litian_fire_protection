meaning: 依原表說明三圖例：粗黑實線為耐燃保護；斜線填充之雙線為耐熱保護；空心雙線為同軸電纜；細實線為一般配線；點虛線為配管。各格以「—」連接一段配線的兩端裝置、段與段以「、」分隔；段名後之「（註X）」表示圖上該段旁印有「註X」字樣，註文見本部分 notes。
