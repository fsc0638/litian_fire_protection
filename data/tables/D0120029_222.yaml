- by: 第一輪轉錄者（Sonnet）
  date: '2026-10-01'
  method: PDF 第 1 頁（第一款表）與第 3 頁（係數表）：以 pymupdf 讀取表格框線（係數表 8 欄 × 53 列物品 + 備註列）與每個字詞座標，以座標將文字層字詞對應到儲存格（空白格即無字詞）；再與 150dpi／300dpi 圖逐列目視核對（物品名與數值）。列名、欄名、註以 PDF 文字層逐字核對。第 2 頁為條文文字（惰性氣體滅火設備準用條款等），無表，不轉錄。
