- by: 裁決者（主對話 Claude Opus 5.5）
  date: '2026-10-01'
  method: 以程式逐格比對兩輪（全半形與空白不計；轉錄者自加說明不計），內容不同處與所有公式對照 PDF 原圖裁決
meaning: 第一項第一款表：格內為中文數字，原表無符號說明；「－」原表未說明，意義依條文。第三項係數表：原表註「標有－者不可用為該公共危險物品之滅火劑。」；空白格原表未說明，意義依條文。
