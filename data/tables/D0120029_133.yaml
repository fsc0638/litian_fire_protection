parts:
- title: 第一款 距揚聲器一公尺處所測得之音壓表
  kind: table
  columns:
  - 音壓
  rows:
  - 'no': 1
    place: Ｌ級
    cells:
      音壓:
        raw: 92分貝以上
  - 'no': 2
    place: Ｍ級
    cells:
      音壓:
        raw: 87分貝以上92分貝未滿
  - 'no': 3
    place: Ｓ級
    cells:
      音壓:
        raw: 84分貝以上87分貝未滿
  notes:
  - （轉錄說明）列名欄之欄頭為「揚聲器種類」，未列入 columns。
  - （轉錄說明）Ｍ級、Ｓ級之音壓格內原文分兩行書寫（如「87分貝以上」與「92分貝未滿」上下排列，同一格內無格線分隔），此處直接相連。
  - （轉錄說明）Ｌ、Ｍ、Ｓ 原文為全形英文字母；數字 92、87、84 為半形。
- title: 第三款第一目 廣播區域內距樓地板面一公尺處之音壓公式
  kind: formula
  formula: P = p + 10log10(Q / (4πr^2) + 4(1 − α) / (Sα))
  variables:
    P: 音壓（單位：dB）
    p: 揚聲器音響功率（單位：dB）
    Q: 揚聲器指向係數
    r: 受音點至揚聲器之距離（單位：公尺）
    α: 廣播區域之平均吸音率
    S: 廣播區域內牆壁、樓地板及天花板面積之合計（單位：平方公尺）
  notes:
  - （轉錄說明）原式以斜分數排版（Q⁄4πr²、4(1−α)⁄Sα），外層括號為原式所有；改寫為單行時於分母 4πr^2、Sα 加括號。「log10」為原式 log 下標 10。
  - （轉錄說明）原文各變數以「P 值：」「S 值：」等形式說明（α 之說明文字層作「α值：」，無空白）；P、p、Q、r 之說明在第1頁，α、S 之說明在第2頁。
- title: 第三款第二目 殘響時間在三秒以上時距揚聲器之距離公式
  kind: formula
  formula: r = (3/4)√(QSα / (π(1 − α)))
  variables:
    r: 受音點至揚聲器之距離（單位：公尺）
    Q: 揚聲器指向係數
    S: 廣播區域內牆壁、樓地板及天花板面積之合計（單位：平方公尺）
    α: 廣播區域之平均吸音率
  notes:
  - （轉錄說明）原式為 r＝¾√（QSα⁄π(1−α)），係數 3/4 以斜分數書寫於根號前，根號涵蓋整個分數；改寫為單行時於 3/4 及分母 π(1 − α) 加括號。
notes: []
