meaning: 原表備註一：本表中「○」標示代表可選設該項滅火設備；「Δ」標示代表電子工業（指積體電路製造業、半導體封裝及測試業、液晶面板及組件製造業、發光二極體製造業、太陽能電池製造業及其他經中央主管機關認定之業別）可選設該項滅火設備。
