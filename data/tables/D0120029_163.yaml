parts:
- title: 避難器具操作面積表
  kind: table
  columns:
  - 操作面積
  rows:
  - 'no': 1
    place: 緩降機、避難梯、避難繩索及滑杆
    cells:
      操作面積:
        raw: 零點五平方公尺以上（不含避難器具所佔面積）。但邊長應為六十公分以上。
  - 'no': 2
    place: 救助袋
    cells:
      操作面積:
        raw: 寬一百五十公分以上，長一百五十公分以上(含器具所占面積)。但無操作障礙，且操作面積在二點二五平方公尺以上時，不在此限。
  - 'no': 3
    place: 滑臺、避難橋
    cells:
      操作面積:
        raw: 依避難器具大小及形狀留置之。
  notes:
  - 【轉錄說明】原表部分格內另附尺寸示意圖（低解析點陣圖），兩輪判讀不一致、多處看不清，未納入；請看官方 PDF 第 [1] 頁原圖。
notes: []
source_quirks:
- 第1列（緩降機、避難梯、避難繩索及滑杆）寫「所佔面積」，第2列（救助袋）寫「所占面積」，同表「佔／占」用字不一致，照原文保留。
- 第1列括號為全形「（不含避難器具所佔面積）」，第2列括號為半形「(含器具所占面積)」（PDF 文字層碼位 U+0028／U+0029），照原文保留。
