uncertain:
- （第一輪）「鹵化烴」字形：PDF 文字層為「烴」(U+70F4)，但頁面渲染字形看起來是「煙」(U+7159)，拿不準原稿究竟是哪個字（法規慣用詞為「鹵化烴」）；本檔採文字層「烴」，請校對者對照官方公報確認（出現於室內儲槽場所兩列的滅火設備欄）
