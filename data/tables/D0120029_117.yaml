  notes:
  - 一、○表可選擇設置。
  - 二、場所1 所使用之差動式局限型或補償式局限型探測器或差動式分布型之檢出器，應具灰塵、粉末不易入侵之構造。
  - 三、場所2、4、8 所使用之定溫式或補償式探測器，應具有防水性能。
  - 四、場所3 所使用之定溫式或補償式探測器，應依腐蝕性氣體別，使用具耐酸或耐鹼性能者，使用差動式分布型時，其空氣管及檢出器應採有效措施，防範腐蝕性氣體侵蝕。
  - （轉錄說明）以上四則為原表「註：」內容，原文置於表格框內最後一列；註二原文於「應具灰塵」後換行，次行以「、粉末不易入侵之構造。」起頭，此處直接相連。
  - （轉錄說明）原表為合併儲存格：左上角「場所」跨兩列表頭（並跨列頭三欄），為欄軸標題；每欄表頭上列為編號 1～9、下列為場所狀況，欄名以「編號／狀況」串接。
  - （轉錄說明）原表為合併儲存格：列軸「適用探測器」縱向合併涵蓋全部九列（含火焰式），已套用至每列 place；「差動式局限型」「差動式分布型」「補償式局限型」「定溫式」各縱向合併涵蓋其下兩列（種別），已套用至該兩列；「火焰式」橫向合併跨探測器種類與種別兩欄，無種別。
  - （轉錄說明）表頭、列頭文字在格內換行（如「灰塵、／粉末會／大量滯／留之場／所」），此處直接相連不加分隔。
