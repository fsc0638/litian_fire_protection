source_quirks:
- 註二、三、四之「場所1 所」「場所2、4、8 所」「場所3 所」，文字層在數字後有一個半形空白（數字前無；圖面上數字兩側皆有間距），照文字層保留。
- 欄1表頭作「灰塵、粉末會大量滯留之場所」，與本條第一項第一款條文「塵埃、粉末或水蒸氣會大量滯留之場所」用字不同（灰塵／塵埃），照表原文，未更正。
- PDF 文字層另含頁面上被遮蔽不顯示的前條末句「號時，應立即全區鳴動。」及頁尾「行政院公報 第027 卷 第117 期 20210625 內政篇」；頁面上第一百十七條條號上方可見該被遮蔽文字的細微殘跡。
uncertain:
- （第二輪）law_version 依規格填 '20240424'，但本 PDF 文字層隱藏頁尾顯示其取自 2021-06-25 行政院公報（第027卷第117期）；此 PDF 之表格是否即 20240424 版本內容，請校對者確認（表格本身各格判讀無疑義）。
- （第一輪）結構選擇：表頭左上角「場所」與左側「適用探測器」是否應分別作為 columns 前綴（「場所／1／…」）與 place 前綴；我只把「適用探測器」放入 place、「場所」未放入 columns（因其為跨列頭合併的左上角格，且註文以「場所1」稱呼各欄，故以編號區分），請比對時留意。
