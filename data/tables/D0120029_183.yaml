source_quirks:
- 第2頁標示圖框內寫「中繼泵浦運轉時」，條文寫「中繼幫浦」，「泵浦／幫浦」用字不一致，照原文保留。
- PDF 第1、2頁文字層含有畫面上被白色矩形遮蓋、看不見的其他條文文字（第1頁：前一條第三款（二）至第五款內容及行政院公報頁首「第027 卷 第117 期 20210625 內政篇」；第2頁：第一百八十五條開頭）；本檔只依可見內容轉錄，使用文字層時需排除這些遮蓋文字。
uncertain:
- （第二輪）公式變數對應為推定：原文只並列文字式與符號式，未逐一定義 H、h1、h2、h3、60m；本檔依兩式項次順序對應（60m 對應「放水壓力」，為常數非變數）。
- （第二輪）標示圖為點陣圖：「㎝」判讀為單一字元（c 與 m 擠在一格），「７」「２０」依字距判讀為全形數字，「／」判讀為全形斜線，「^2」為「㎝」右上方之上標2；以上碼位無法由點陣確定。
- （第一輪）第九款標示圖／牌面第一行：第2字判讀為「繼」、第3字判讀為「泵」，圖為低解析點陣字，第3字上半部近似「系」，也可能是其他字形；整行判讀為「中繼泵浦運轉時」。
- （第一輪）第九款標示圖／牌面第二行：「kgf／cm^2」之斜線在圖中為長斜線，不確定原為全形「／」或半形「/」，本檔採全形「／」。
- （第一輪）第九款標示圖／尺寸標註：「7cm以上」「20cm以上」之單位字形為 ㎝ 或 cm 無法分辨；「2 0」兩個數字之間在圖中有空隙，判讀為 20。
cross_check: 2026-10-01 兩輪比對：兩條公式文字一致（第二輪另依項次推定符號對應，屬推測未收錄）；標示牌四項內容（中繼泵浦運轉時、送水壓力 kgf／cm^2、7cm以上、20cm以上）兩輪一致，僅全半形判讀不同。
