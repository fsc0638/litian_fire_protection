uncertain:
- （第一輪）第 5 列「汽車修理廠、室內停車空間及昇降機械式停車場」只有一個「十五」，圖面確認為橫跨兩欄的合併儲存格；已依規格規則 2 套用到「快速反應型」「一般反應型」兩欄。此為結構判讀決定，供比對時留意（若另一位轉錄者只填快速反應型欄，差異即源於此）。
