  notes:
  - 轉錄說明：列頭欄的標題為「各類場所」（原表字距拉開，印成「各　類　場　所」，跨兩個列頭欄及兩層表頭列）；欄頭「撒水頭數量」為跨「快速反應型」「一般反應型」兩欄的合併儲存格。「快速反應型」「一般反應型」在原格內分兩行印（「快速」「反應型」），此處相連。
  - 轉錄說明：原表為合併儲存格：「十樓以下建築物」跨第2至4列（且跨頁，第2頁頂端該格為延續的空白框）；「高架儲存倉庫」跨第6、7列；「十一樓以上建築物、地下建築物」與「汽車修理廠、室內停車空間及昇降機械式停車場」各橫跨兩個列頭欄。
  - 轉錄說明：第5列「汽車修理廠、室內停車空間及昇降機械式停車場」的「十五」為橫跨「快速反應型」「一般反應型」兩欄的合併儲存格（PDF 向量框線在這一列兩欄之間沒有分隔線），依規格套用到兩欄。
  - 轉錄說明：本表跨第1、2頁；第1頁至「供第十二條第一款第四目使用及複合用途建築物中供第十二條第一款第四目使用者」列止，第2頁自「地下層」列起。
