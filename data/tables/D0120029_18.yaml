- 水霧
- 泡沫
- 二氧化碳或惰性氣體
- 鹵化烴
- 乾粉
rows:
- 'no': 1
  place: 屋頂直昇機停機場（坪）。
  marks:
  - 泡沫
  - 乾粉
- 'no': 2
  place: 飛機修理廠、飛機庫樓地板面積在二百平方公尺以上者。
  marks:
  - 泡沫
  - 乾粉
- 'no': 3
  place: 汽車修理廠、室內停車空間在第一層樓地板面積五百平方公尺以上者；在地下層或第二層以上樓地板面積在二百平方公尺以上者；在屋頂設有停車場樓地板面積在三百平公尺以上者。
  marks:
  - 水霧
  - 泡沫
  - 二氧化碳或惰性氣體
  - 鹵化烴
  - 乾粉
- 'no': 4
  place: 昇降機械式停車場可容納十輛以上者。
  marks:
  - 水霧
  - 泡沫
  - 二氧化碳或惰性氣體
  - 鹵化烴
  - 乾粉
- 'no': 5
  place: 發電機室、變壓器室及其他類似之電器設備場所，樓地板面積在二百平方公尺以上者。
  marks:
  - 水霧
  - 二氧化碳或惰性氣體
  - 鹵化烴
  - 乾粉
- 'no': 6
  place: 鍋爐房、廚房等大量使用火源之場所，樓地板面積在二百平方公尺以上者。
  marks:
  - 二氧化碳或惰性氣體
  - 鹵化烴
  - 乾粉
- 'no': 7
  place: 電信機械室、電腦室或總機室及其他類似場所，樓地板面積在二百平方公尺上者。
  marks:
  - 二氧化碳或惰性氣體
  - 鹵化烴
  - 乾粉
notes:
- 一、大量使用火源場所，指最大消費熱量合計在每小時三十萬千卡以上者。
- 二、廚房如設有自動撒水設備，且排油煙管及煙罩設簡易自動滅火裝置時，得不受本表限制。
- 三、停車空間內車輛採一列停放，並能同時通往室外者，得不受本表限制。
- 四、本表項目三及項目四所列應設場所得設置自動撒水設備；項目七所列應設場所得設置預動式自動撒水設備，不受本表限制。
- 五、平時有特定或不特定人員使用之中央管理室、防災中心等類似處所，不得設置二氧化碳滅火設備。
