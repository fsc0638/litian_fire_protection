- （第一輪）第八款表「七十五以上／九十九以下」「一百以上／一百四十九以下」兩欄名在原格內是折行呈現、無頓號或連接詞；轉錄時直接接成「七十五以上九十九以下」「一百以上一百四十九以下」，此接法為轉錄者判斷（圖面與文字層皆未見分隔符）。
