  notes:
  - 轉錄說明：原表為橫向排列：最左欄最上方的合併儲存格「設置場所」是表頭列（各設置場所）的標題，其下三格為三個資料列的列名；此處欄名取自表頭列，未加「設置場所」前綴。
  - 轉錄說明：原表為合併儲存格：「乾式電器設備室（油浸機器除外）」跨兩個子欄；「其他」跨四個子欄（原表字距拉開，印成「其　…　他」）；「電信機械室、總機室」與「設置場所」各跨兩層表頭列。
  - 轉錄說明：「滅火藥劑之基本需要量（kg）」列的前四欄（乾式電器設備室兩欄、電信機械室、總機室、其他／未滿五十立方公尺）在原表為空白格，依規格不寫。
  - 轉錄說明：第1列列名的單位，原文是「m」後接縮小字級的上標「3」，依規格寫成「m^3」；第2列單位原文是單一字元「㎡」（U+33A1），照原字保留。
  - 轉錄說明：格內文字因欄寬窄而逐字或兩字換行（例如「一點三三」為四字直排），此處相連書寫。
- title: 第二款第二目 局部放射方式（前目以外防護對象）假想防護空間單位體積滅火藥劑量
  kind: formula
  formula: Q = 8 − 6 × a / A
  variables:
    Q: 假想防護空間單位體積滅火藥劑量（公斤/立方公尺），所需追加倍數比照前目規定。
    a: 防護對象周圍實存牆壁面積之合計（平方公尺）。
    A: 假想防護空間牆壁面積之合計（平方公尺）。
  notes:
  - 轉錄說明：原式「a/A」以斜線分數排印（a 在左上、A 在右下）；Q、a、A 原文為斜體。條文本文另說明以 Q 乘以假想防護空間體積計算所需滅火藥劑量（屬條文文字，未納入公式）。
notes: []
