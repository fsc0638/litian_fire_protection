meaning: 公式符號意義見公式部分之 variables（照原文）；比容積公式中之 t 依原文變數 S 之說明「防護空間之最低溫度（t℃）」
parts:
- title: 第一款 所需滅火藥劑量公式
  kind: formula
  formula: W = (V / S)(C / (100 − C))
  variables:
    W: 防護空間所需藥劑量（kg）
    V: 防護空間淨體積（m³，得扣除不滲透且不可移動固體體積）
    S: 防護空間之最低溫度（t℃）、一大氣壓下之比容積（m³/kg）
    C: 設計濃度百分比（%，體積百分比）
  notes:
  - （轉錄說明）原式為上下分數排版：W＝V/S（C/100−C），即 V 在 S 之上、C 在 100−C 之上，外層括號為原式所有；改寫為單行時另加括號標示 V/S 及分母 100 − C 之範圍。原式 V/S 與括號之間無乘號。
  - （轉錄說明）變數 S 之說明下方附「比容積公式」表（見下一部分），變數 C 之說明位於該表之後（第2頁）。
- title: 第一款 變數 S 之比容積公式表
  kind: table
  columns:
