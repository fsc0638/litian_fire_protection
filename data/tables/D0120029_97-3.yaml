source_quirks:
- 公式與變數說明以大寫「S」表示比容積，比容積公式表內各式則以小寫「s」書寫（如 s=0.3164+0.0012t），大小寫不一致，照原文保留。
- PDF 第1頁文字層另含頁面上被遮蔽不顯示的前文（「中央主管機關另定之。」、第六節之一標題、第九十七條之一、之二全文），第2頁文字層另含第九十七條之四全文及第九十七條之五第一款至第四款；頁面可見部分只有第九十七條之三，本檔只依可見部分轉錄。
uncertain:
