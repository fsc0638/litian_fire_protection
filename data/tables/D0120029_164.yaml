meaning: 原表符號，意義依條文；救助袋（直降式）附圖另註「H:依器具之構造及長度而言」（末字判讀見 uncertain）
parts:
- title: 避難器具下降空間表
  kind: table
  columns:
  - 下降空間
  rows:
  - 'no': 1
    place: 緩降機
    cells:
      下降空間:
        raw: 以器具中心半徑零點五公尺圓柱形範圍內。但突出物在十公分以內，且無避難障礙者，或超過十公分時，能採取不損繩索措施者，該突出物得在下降空間範圍內。
  - 'no': 2
    place: 避難梯
    cells:
      下降空間:
        raw: 自避難梯二側豎桿中心線向外二十公分以上及其前方六十五公分以上之範圍內。
  - 'no': 3
    place: 避難繩索及滑杆
    cells:
      下降空間:
        raw: 應無避難障礙之空間。
  - 'no': 4
    place: 救助袋（斜降式）
    cells:
      下降空間:
        raw: 救助袋下方及側面，在上端二十五度，下端三十五度方向依下圖所圍範圍內。但沿牆面使用時，牆面側不在此限。
  - 'no': 5
    place: 救助袋（直降式）
    cells:
      下降空間:
        raw: 一、救助袋與牆壁之間隔為三十公分以上。但外牆有突出物，且突出物距救助袋支固器具裝設處在三公尺以上時，應距突出物前端五十公分以上。二、以救助袋中心，半徑一公尺圓柱形範圍內。
  - 'no': 6
    place: 滑臺
    cells:
      下降空間:
        raw: 滑面上方一公尺以上及滑臺兩端向外二十公分以上所圍範圍內。
  - 'no': 7
    place: 避難橋
    cells:
      下降空間:
        raw: 避難橋之寬度以上及橋面上方二公尺以上所圍範圍內。
  notes:
  - 原表跨第1頁至第2頁；第2頁「滑臺」「避難橋」兩列未重複表頭
  - 【轉錄說明】原表部分格內另附尺寸示意圖（低解析點陣圖），兩輪判讀不一致、多處看不清，未納入；請看官方 PDF 第 [1, 2] 頁原圖。
