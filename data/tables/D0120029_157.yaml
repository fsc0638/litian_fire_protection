cross_check: 2026-10-01 兩份轉錄逐格比對：20 格原文全部一致；8 個「同上」的指涉一致（皆指第 2 列）；雙方各自獨立標出同一個疑義格（第 5 列第二層）。
review_notes:
- 第 5 列「第二層」的「同上」：正上方第 4 列此欄為空白（第 4 列只適用第三層以上），目前越過空白依第 2 列解讀，請確認。
- 「同上」一律解讀為「同欄上方」（法規表格慣例）。獨立轉錄者提出另一種讀法：第 3 列地下層只寫「避難梯」，同列其他欄的「同上」也可能指同列左格；請確認採同欄上方。
