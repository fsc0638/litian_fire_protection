# 圖塊字典：事務所自訂的圖塊名稱／圖層名稱 → 消防署附件三「消防圖說圖示範例」的圖例名稱（＋預設規格）
#
# - 圖塊名稱正規化後（去空白、全半形括號、「，、」「侷局」一致）等於圖例名稱者自動認得，不必列。
# - blocks 比對圖塊名稱；認不出時再用 layers 比對所在圖層（匿名圖塊 A$C… 多靠圖層名稱辨識）。
# - spec 是預設規格，圖塊屬性有寫的以屬性為準。
# - 只放已確認的對應；推測的不要放（例：排煙系統圖層上與手動開關一對一的匿名圖塊，待事務所確認）。
# - 圖例名稱必須存在於附件三，載入時會檢查。
#
# 來源：2026-10-02 竣工圖實測（圖塊名稱與符號內文字、圖層名稱、設計者的數量表互相對照）

blocks:
  # 火警
  - match: "^FP-偵煙式探測器$"
    legend: 偵煙式局限型探測器（2種）
    note: 符號內標「S」；種別未標示，以一般場所常用之 2 種計（1、2 種有效探測範圍相同）
  - match: "^FP-FMM$|^FMM-\\d+$"
    legend: 定址型接點監視中繼器
  - match: "^FP-FRM$|^FRM-\\d+$"
    legend: 定址型控制中繼器
  # 滅火器
  - match: "^FP-滅火器ABC-10$"
    legend: 乾粉滅火器
    spec: {a_value: 3}
    note: 設計者數量表註明 ABC-10 型滅火效能值 A-3,B-10,C
  # 室內外消防栓
  - match: "^FP-綜合消防栓箱$"
    legend: 綜合消防栓箱
  - match: "^HD-\\d+$"
    legend: 室外消防栓
    note: 位於「室外消防栓箱」圖層
  # 標示設備、緊急照明
  - match: "^Dlight\\d*$"
    legend: 避難方向指示燈（單面單向）
    spec: {grade: B}
    note: 符號內標「B」；變更說明「方向指示燈(B級單面單)」
  - match: "^OLight$"
    legend: 避難方向指示燈（單面單向）
    spec: {grade: C}
    note: 符號內標「C」；變更說明「(C級單面單)」
  - match: "^EPL$"
    legend: 緊急照明燈（吸頂式）
    note: 位於「緊急照明」圖層，符號內標「E」
  - match: "^緊急照明燈（壁掛）$|^緊急照明燈\\(壁掛\\)$"
    legend: 緊急照明燈（壁掛式）
  # 緊急廣播
  - match: "^\\d+[wW]壁掛$"
    legend: 揚聲器（壁掛式）
    note: 符號內標「3W」「S」
  # 排煙
  - match: "^SEF-\\d+$"
    legend: 排煙機（平面圖用）
    note: 位於「排煙風機」圖層
  - match: "^排煙手動$"
    legend: 手動開關裝置

layers: []
