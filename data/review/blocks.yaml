# 圖塊字典：事務所自訂的圖塊名稱／圖層名稱 → 消防署附件三「消防圖說圖示範例」的圖例名稱（＋預設規格）
#
# - 圖塊名稱正規化後（去空白、全半形括號、「，、」「侷局」一致）等於圖例名稱者自動認得，不必列。
# - blocks 比對圖塊名稱；認不出時再用 layers 比對所在圖層（匿名圖塊 A$C… 多靠圖層名稱辨識）。
# - spec 是預設規格，圖塊屬性有寫的以屬性為準。
# - 只放已確認的對應；推測的不要放（例：排煙系統圖層上與手動開關一對一的匿名圖塊，待事務所確認）。
# - 圖例名稱必須存在於附件三，載入時會檢查。
#
# 來源：2026-10-02 竣工圖實測（圖塊名稱與符號內文字、圖層名稱、符號形狀與附件三比對、設計者的數量表與各張圖例表互相對照）

blocks:
  # 火警
  - match: "^FP-偵煙式探測器$"
    legend: 偵煙式局限型探測器（1種、定址式）
    note: 符號內標「S」；各樓層圖例表寫「定址偵煙式探測器1種」
  - match: "^UVIR$"
    legend: 火焰式探測器
    note: 圓內三角（附件三火焰式探測器符號）；圖例表「火焰式探測器」、位址文字「火焰探測器N…」
  - match: "^FP-火警總機$"
    legend: 火警受信總機
  - match: "^FP-FMM$|^FMM-\\d+$"
    legend: 定址型接點監視中繼器
  - match: "^FP-FRM$|^FRM-\\d+$"
    legend: 定址型控制中繼器
  # 滅火器
  - match: "^FP-滅火器ABC-10$"
    legend: 乾粉滅火器
    spec: {a_value: 3}
    note: 設計者數量表註明 ABC-10 型滅火效能值 A-3,B-10,C
  # 室內外消防栓（綜合消防栓箱同時含火警發信機、標示燈，見 equipment.KIND_RULES）
  - match: "^FP-綜合消防栓箱$"
    legend: 綜合消防栓箱
  - match: "^HD-\\d+$"
    legend: 室外消防栓
    note: 位於「室外消防栓箱」圖層
  # 標示設備、緊急照明
  - match: "^Dlight3$"
    legend: 避難方向指示燈（單面單向）
    spec: {grade: B}
    note: 符號內標「B」；圖形畫在離基準點約 571 m 處（位置以圖形中心為準），各張圖例表 B 級數量相符
  - match: "^Dlight2?$"
    legend: 避難方向指示燈（單面單向）
    spec: {grade: C}
    note: 符號內標「C」
  - match: "^OLight$"
    legend: 出口標示燈
    spec: {grade: C}
    note: 圓內打叉加吊桿（附件三出口標示燈符號），內容畫在「FP-EL-出口標示燈」圖層；數量與數量表 C 級出口標示燈相符
  - match: "^EPL$"
    legend: 緊急照明燈（吸頂式）
    note: 位於「緊急照明」圖層，符號內標「E」
  - match: "^緊急照明燈（壁掛）$|^緊急照明燈\\(壁掛\\)$"
    legend: 緊急照明燈（壁掛式）
  # 緊急廣播
  - match: "^\\d+[wW]壁掛$"
    legend: 揚聲器（壁掛式）
    note: 符號內標「3W」「S」
  # 排煙
  - match: "^SEF-\\d+$"
    legend: 排煙機（平面圖用）
    note: 位於「排煙風機」圖層
  - match: "^排煙手動$"
    legend: 手動開關裝置
  - match: "^M07$"
    legend: 排煙機控制盤
    note: 方框內四格棋盤（附件三排煙機控制盤符號），扣除圖例表內符號後數量與圖例表相符

layers: []
