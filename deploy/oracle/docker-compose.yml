# 消防圖審系統：第 0 期基礎服務（Oracle Always Free，ARM64）
# 所有映像都已確認有 arm64 版（2026-09-30 查 Docker Hub）。
# 資料庫、搜尋、佇列只接內部網路，不對外開埠；只有 Caddy 對外 80/443。
name: litian

services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: litian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: litian
      POSTGRES_USER: litian
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?缺 POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litian -d litian"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.54.2
    container_name: litian-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?缺 MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ./data/meili:/meili_data
    networks: [internal]
    mem_limit: 1g

  redis:
    image: redis:8.8-alpine
    container_name: litian-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./data/redis:/data
    networks: [internal]
    mem_limit: 256m

  api:
    build: ./repo                # /opt/litian/repo＝GitHub clone（06_update_from_git.sh 更新）
    image: litian-api:0.1
    container_name: litian-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://litian:${POSTGRES_PASSWORD}@postgres:5432/litian
      MEILI_URL: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      # 法規問答：金鑰與存取碼都填了才啟用 AI 回答（由使用者本人填在 .env）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ASK_ACCESS_CODE: ${ASK_ACCESS_CODE:-}
      ASK_DAILY_LIMIT: ${ASK_DAILY_LIMIT:-500}
      CASES_DIR: /data/cases
      # 審核工作台用 LINE 登入（LINE Login 頻道；由使用者本人填在 .env，三個都填了才啟用）
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_CALLBACK_URL: ${LINE_LOGIN_CALLBACK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - ./data/cases:/data/cases       # 工作台上傳的圖說（worker 共用）
    ports:
      - "127.0.0.1:8100:8000"   # 只綁主機本機，由主機層 Caddy 轉送 /api/*
    networks: [internal, edge]  # internal 連資料庫；edge 讓呼叫 OpenAI、LINE API 能出外網
    mem_limit: 768m
    logging:                    # 容器日誌輪替（預設不輪替、一直累積）
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  # 圖面處理：佇列在 PostgreSQL；DWG 交給 converter 轉檔，抽取在 worker 的子行程（限時、限記憶體）
  worker:
    image: litian-api:0.1          # 與 api 同一份程式（由 api 的 build 產生）
    container_name: litian-worker
    restart: unless-stopped
    command: ["python", "-m", "litian.drawing.worker"]
    environment:
      DATABASE_URL: postgresql://litian:${POSTGRES_PASSWORD}@postgres:5432/litian
      CASES_DIR: /data/cases
      CONVERT_SPOOL: /data/convert
    volumes:
      - ./data/cases:/data/cases
      - ./data/convert:/data/convert
      - ./samples:/data/samples:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]          # 不出外網
    mem_limit: 1536m

  # DWG 轉檔：LibreDWG（beta，近期仍在修記憶體安全漏洞）只在這個隔離容器跑。
  # 無網路、唯讀根目錄、限資源、不碰資料庫；只透過 data/convert 交接資料夾收件交件。
  converter:
    build:
      context: ./repo
      dockerfile: deploy/oracle/libredwg/Dockerfile
    image: litian-libredwg:0.14
    container_name: litian-converter
    restart: unless-stopped
    entrypoint: ["/opt/venv/bin/python", "/app/converter.py"]
    network_mode: none
    read_only: true
    tmpfs: ["/tmp:size=64m"]
    volumes:
      - ./data/convert:/convert
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    pids_limit: 64
    cpus: 1
    mem_limit: 768m

  # 獨立主機才用自己的 Caddy（LITIAN_STANDALONE=1 時 02_up.sh 會帶 --profile standalone）。
  # 主機上已有 Caddy 時不啟用，改在主機層 Caddy 加網站區塊（04_host_caddy_site.sh）。
  caddy:
    profiles: ["standalone"]
    image: caddy:2.11.4-alpine
    container_name: litian-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - ./data/caddy_config:/config
    networks: [internal, edge]
    mem_limit: 256m

networks:
  internal:
    internal: true   # 內部網路：資料庫等服務連不到外網，外網也連不到它們
  edge: {}
