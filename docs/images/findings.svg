<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="缺失呈現示意：圖上標示位置，每條缺失附嚴重度、依據條文與建議">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ef4444" fill-opacity=".16"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ef4444" stroke-width="2" stroke-opacity=".75"/>
    </pattern>
    <clipPath id="room"><rect x="70" y="70" width="420" height="240"/></clipPath>
    <style>
      text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',sans-serif}
      .wall{fill:none;stroke:#e2e8f0;stroke-width:2.5;stroke-linejoin:round}
      .part{fill:none;stroke:#94a3b8;stroke-width:1.6}
      .cov{fill:#fb923c;fill-opacity:.12;stroke:#fb923c;stroke-opacity:.5}
      .head{fill:#fb923c}
      .det{fill:none;stroke:#fb923c;stroke-width:1.6}
      .lbl{fill:#94a3b8;font-size:13px}
      .card{opacity:0;animation:up .7s ease-out forwards}
      .c1{animation-delay:.5s}.c2{animation-delay:1.3s}
      .box{fill:#111a2e;stroke:#334155;stroke-width:1.2}
      .title{fill:#f1f5f9;font-size:17px;font-weight:700}
      .k{font-size:13px;font-weight:700}
      .v{fill:#cbd5e1;font-size:13px}
      .btn{fill:none;stroke-width:1.2}
      .bt{font-size:12px;text-anchor:middle}
      @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>

  <!-- 左：平面圖（示意） -->
  <rect x="40" y="40" width="480" height="300" rx="16" fill="#0f172a" stroke="#334155"/>
  <g clip-path="url(#room)">
    <g class="cov">
      <circle cx="348" cy="118" r="56"/><circle cx="436" cy="118" r="56"/>
      <circle cx="348" cy="206" r="56"/><circle cx="436" cy="206" r="56"/>
      <circle cx="348" cy="290" r="56"/>
    </g>
    <rect x="404" y="250" width="84" height="58" fill="url(#hatch)" stroke="#ef4444" stroke-width="1.5"/>
  </g>
  <rect class="wall" x="70" y="70" width="420" height="240"/>
  <path class="part" d="M300 70V200M300 230V310"/>
  <text class="lbl" x="84" y="92">機房</text>
  <text class="lbl" x="314" y="92">倉庫</text>
  <text class="lbl" x="70" y="332" font-size="12" fill="#64748b">3F ・ 消防設備平面圖（示意）</text>
  <g class="head">
    <circle cx="348" cy="118" r="4"/><circle cx="436" cy="118" r="4"/>
    <circle cx="348" cy="206" r="4"/><circle cx="436" cy="206" r="4"/>
    <circle cx="348" cy="290" r="4"/>
  </g>
  <g class="det">
    <circle cx="150" cy="150" r="9"/><text x="150" y="154" text-anchor="middle" fill="#fb923c" font-size="10" stroke="none">S</text>
    <circle cx="230" cy="236" r="9"/><text x="230" y="240" text-anchor="middle" fill="#fb923c" font-size="10" stroke="none">S</text>
  </g>
  <!-- 標記 1 -->
  <g>
    <circle cx="446" cy="279" r="10" fill="none" stroke="#ef4444" stroke-width="2">
      <animate attributeName="r" from="10" to="26" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".9" to="0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="446" cy="279" r="11" fill="#ef4444"/>
    <text x="446" y="284" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">1</text>
  </g>
  <!-- 標記 2 -->
  <g>
    <circle cx="120" cy="262" r="10" fill="none" stroke="#facc15" stroke-width="2">
      <animate attributeName="r" from="10" to="26" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from=".9" to="0" dur="1.6s" begin=".8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="262" r="11" fill="#facc15"/>
    <text x="120" y="267" text-anchor="middle" fill="#1e293b" font-size="12" font-weight="700">2</text>
  </g>

  <!-- 右：缺失卡 1 -->
  <g transform="translate(560,52)">
    <g class="card c1">
      <rect class="box" width="600" height="140" rx="14"/>
      <circle cx="30" cy="34" r="13" fill="#ef4444"/><text x="30" y="39" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">1</text>
      <rect x="54" y="20" width="72" height="24" rx="12" fill="#7f1d1d"/><text x="90" y="37" text-anchor="middle" fill="#fecaca" font-size="12">距離超過</text>
      <rect x="134" y="20" width="40" height="24" rx="12" fill="#1e293b" stroke="#334155"/><text x="154" y="37" text-anchor="middle" fill="#cbd5e1" font-size="12">3F</text>
      <rect x="182" y="20" width="80" height="24" rx="12" fill="#1e293b" stroke="#334155"/><text x="222" y="37" text-anchor="middle" fill="#cbd5e1" font-size="12">撒水設備</text>
      <text class="title" x="54" y="76">倉庫 有 4.6 ㎡ 不在任何撒水頭涵蓋範圍內</text>
      <text class="k" x="54" y="102" fill="#fb923c">依據</text><text class="v" x="92" y="102" fill="#5eead4">各類場所消防安全設備設置標準 第 46 條</text>
      <text class="k" x="54" y="124" fill="#fb923c">建議</text><text class="v" x="92" y="124">增設撒水頭或調整位置，使該區納入涵蓋範圍</text>
      <rect class="btn" x="446" y="98" width="68" height="26" rx="13" stroke="#fb923c"/><text class="bt" x="480" y="115" fill="#fed7aa">在圖上看</text>
      <rect class="btn" x="520" y="98" width="30" height="26" rx="13" stroke="#2dd4bf"/><text class="bt" x="535" y="115" fill="#99f6e4">接受</text>
      <rect class="btn" x="556" y="98" width="30" height="26" rx="13" stroke="#64748b"/><text class="bt" x="571" y="115" fill="#cbd5e1">退回</text>
    </g>
  </g>

  <!-- 右：缺失卡 2 -->
  <g transform="translate(560,206)">
    <g class="card c2">
      <rect class="box" width="600" height="140" rx="14"/>
      <circle cx="30" cy="34" r="13" fill="#facc15"/><text x="30" y="39" text-anchor="middle" fill="#1e293b" font-size="13" font-weight="700">2</text>
      <rect x="54" y="20" width="72" height="24" rx="12" fill="#713f12"/><text x="90" y="37" text-anchor="middle" fill="#fef08a" font-size="12">資料不足</text>
      <rect x="134" y="20" width="40" height="24" rx="12" fill="#1e293b" stroke="#334155"/><text x="154" y="37" text-anchor="middle" fill="#cbd5e1" font-size="12">3F</text>
      <rect x="182" y="20" width="80" height="24" rx="12" fill="#1e293b" stroke="#334155"/><text x="222" y="37" text-anchor="middle" fill="#cbd5e1" font-size="12">火警探測器</text>
      <text class="title" x="54" y="76">機房 探測器數量需補資料才能判定</text>
      <text class="k" x="54" y="102" fill="#fb923c">要補</text><text class="v" x="92" y="102">天花板高度、探測器種類與感度</text>
      <text class="k" x="54" y="124" fill="#fb923c">建議</text><text class="v" x="92" y="124">在工作台「檢核條件」補填後，只重跑檢核、不重新轉檔</text>
      <rect class="btn" x="446" y="98" width="140" height="26" rx="13" stroke="#64748b"/><text class="bt" x="516" y="115" fill="#cbd5e1">依據　設置標準 第 120 條</text>
    </g>
  </g>

  <text x="600" y="370" text-anchor="middle" fill="#475569" font-size="12">示意畫面，非真實案件</text>
</svg>
