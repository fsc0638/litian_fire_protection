<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="系統組成：介面、服務、資料與外部來源">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5 0 10Z" fill="#64748b"/>
    </marker>
    <style>
      text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei','Segoe UI',sans-serif}
      .h{fill:#64748b;font-size:13px;letter-spacing:3px;text-anchor:middle}
      .box{fill:#111a2e;stroke:#334155;stroke-width:1.2}
      .ext{fill:#0f172a;stroke:#475569;stroke-width:1.2;stroke-dasharray:5 4}
      .t{fill:#f1f5f9;font-size:16px;font-weight:700;text-anchor:middle}
      .s{fill:#94a3b8;font-size:12px;text-anchor:middle}
      .flow{fill:none;stroke:#64748b;stroke-width:1.8;stroke-dasharray:6 6;animation:dash 1s linear infinite}
      .end{marker-end:url(#arr)}
      .lab{fill:#64748b;font-size:11px;text-anchor:middle}
      @keyframes dash{to{stroke-dashoffset:-12}}
    </style>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>

  <text class="h" x="165" y="46">介面</text>
  <text class="h" x="475" y="46">服務</text>
  <text class="h" x="805" y="46">資料</text>
  <text class="h" x="1075" y="46">外部來源</text>

  <!-- 介面 -->
  <g transform="translate(40,70)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">審核工作台</text>
    <text class="s" x="125" y="52">LINE 登入 ・ 案件與上傳 ・ 缺失審核 ・ 報告</text>
  </g>
  <g transform="translate(40,170)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">法規問答網頁</text>
    <text class="s" x="125" y="52">檢索 → AI 回答 → 引用查核</text>
  </g>

  <!-- 服務 -->
  <g transform="translate(350,70)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">API 服務</text>
    <text class="s" x="125" y="52">FastAPI ・ 登入 ・ 案件 ・ 法規檢索與問答</text>
  </g>
  <g transform="translate(350,170)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">背景處理程序</text>
    <text class="s" x="125" y="52">佇列 ・ 抽取 ・ 認房間認設備 ・ 檢核 ・ 原樣圖</text>
  </g>
  <g transform="translate(350,270)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">轉檔沙箱</text>
    <text class="s" x="125" y="52">LibreDWG ・ 無網路 ・ 唯讀 ・ 限資源 ・ 不碰資料庫</text>
  </g>

  <!-- 資料 -->
  <g transform="translate(680,70)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">PostgreSQL + pgvector</text>
    <text class="s" x="125" y="52">案件 ・ 佇列 ・ 檢核結果 ・ 向量</text>
  </g>
  <g transform="translate(680,170)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">Meilisearch</text>
    <text class="s" x="125" y="52">法條關鍵詞檢索</text>
  </g>
  <g transform="translate(680,270)">
    <rect class="box" width="250" height="72" rx="12"/>
    <text class="t" x="125" y="30">法規庫建置產物</text>
    <text class="s" x="125" y="52">2,667 節點 ・ 284 圖例 ・ 20 張結構化表格</text>
  </g>

  <!-- 外部 -->
  <g transform="translate(990,70)">
    <rect class="ext" width="170" height="72" rx="12"/>
    <text class="t" x="85" y="30">OpenAI API</text>
    <text class="s" x="85" y="52">問答 ・ 向量（可替換）</text>
  </g>
  <g transform="translate(990,170)">
    <rect class="ext" width="170" height="72" rx="12"/>
    <text class="t" x="85" y="30">全國法規資料庫</text>
    <text class="s" x="85" y="52">Open API ・ 法律與命令</text>
  </g>
  <g transform="translate(990,270)">
    <rect class="ext" width="170" height="72" rx="12"/>
    <text class="t" x="85" y="30">消防署法令查詢</text>
    <text class="s" x="85" y="52">作業基準 ・ 附件三圖例</text>
  </g>

  <!-- 連線 -->
  <path class="flow end" d="M290 106H346"/>
  <path class="flow end" d="M290 206H320V106H346"/>
  <path class="flow" d="M600 106H640V306"/>
  <path class="flow" d="M600 206H640"/>
  <path class="flow end" d="M640 106H676"/>
  <path class="flow end" d="M640 206H676"/>
  <path class="flow end" d="M640 306H676"/>
  <path class="flow end" d="M475 242V266"/>
  <text class="lab" x="545" y="260">交接資料夾（收件／交件）</text>
  <path class="flow end" d="M990 206H960V306H934"/>
  <path class="flow" d="M990 306H960"/>
  <text class="lab" x="960" y="334">建置時下載</text>
  <path class="flow end" d="M475 70V58H1075V66"/>
  <text class="lab" x="620" y="54">問答／向量</text>

  <text x="600" y="382" text-anchor="middle" fill="#64748b" font-size="13">全部以 Docker Compose 部署；推上 GitHub main 後主機自動測試，通過才部署</text>
</svg>
