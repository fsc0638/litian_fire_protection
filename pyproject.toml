[project]
name = "litian"
version = "0.1.0"
description = "消防圖審系統"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pyyaml>=6.0",
    "openai>=3.22,<4",
    "ezdxf>=1.4,<2",
    "python-multipart>=0.0.9",
    "shapely>=2.0,<3",
    "scipy>=1.13,<2",
    "matplotlib>=3.8,<4",        # CAD 原樣圖：ezdxf 繪圖模組的點陣輸出（Agg；授權寬鬆）
    "pillow>=10",                # CAD 原樣圖切圖磚
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
litian = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
